services:
  - type: web
    name: wurm-tools
    runtime: static
    buildCommand: corepack enable pnpm && corepack prepare pnpm@12.15.0 --activate && pnpm install --frozen-lockfile && pnpm run build
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

name: CI & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bootstrap pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code formatting with Prettier
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run unit test suite with Vitest
        run: pnpm test

      - name: Test production build with Vite
        run: pnpm run build

  fedora-helper-installer:
    name: Fedora 44 offline helper acceptance (unsigned)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build prerequisites
        run: dnf install -y git tar gzip xz shadow-utils gnupg2

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bootstrap pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.15.0 --activate

      - name: Restore locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Fedora test installer
        run: pnpm run helper:installer:build

      - name: Test signing and developer-profile logic without production keys
        run: pnpm test tests/helper-signing.test.js tests/helper-developer.test.js tests/helper-installer.test.js

      - name: Prepare unprivileged acceptance account
        run: |
          useradd --create-home installer-test
          chown -R installer-test:installer-test "$GITHUB_WORKSPACE"

      - name: Test packaged helper as a normal user
        run: runuser --user installer-test -- pnpm run helper:installer:test
